  .switch-track::before {

  .review-word { font-size: 30px; font-weight: 700; margin: 20px 0 24px; }

  .review-btn.tricky { background: rgba(180,72,58,0.1); color: var(--red); }
  .review-btn.know { background: var(--green); color: var(--paper); }
  .review-summary-stat { font-size: 13px; opacity: 0.65; margin: 0 0 18px; }

  .session-row { margin: 0 0 20px; }
  .session-label { font-size: 12px; font-weight: 600; opacity: 0.55; margin: 0 0 8px; }

    padding: 9px 14px; border-radius: 10px; border: 1.5px solid rgba(43,36,25,0.2);

    font-family: inherit; cursor: pointer;
  }
  .session-chip.active { background: var(--navy); color: var(--paper); border-color: var(--navy); }
  .session-count { opacity: 0.6; font-weight: 400; }
</style>
</head>

const STORAGE_KEY = "wordPuzzlesProgress";
const TIMER_SECONDS = 20;

let mode = "classification"; // "classification" | "analogy"
let selectedSession = "session1"; // which bank of classification questions to practice
let screen = "guide";
let queue = null;
let ptr = 0;
let picked = null;
let missReason = null;
let returnScreen = null;
let sessionBankLength = 0;

let firstTryCorrect = 0;
let retryCorrect = 0;
let neverCorrect = 0;
let missVocab = 0;
let missReasoning = 0;
let sessionVocabWords = [];
const requeuedOnce = new Set();

let easyFirst = true;
let timedMode = false;
let timeLeft = TIMER_SECONDS;
let timerInterval = null;

const app = document.getElementById("app");
const letters = ["A", "B", "C", "D"];

/* ---------- persistence ---------- */
function loadProgress() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return { streak: 0, bestStreak: 0, lastPlayed: null, sessions: 0 };
    return JSON.parse(raw);
  } catch (e) { return { streak: 0, bestStreak: 0, lastPlayed: null, sessions: 0 }; }
}
function saveProgress(p) { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(p)); } catch (e) {} }

/* ---------- word bank (vocab review) ---------- */
const WORD_BANK_KEY = "wordPuzzlesWordBank";
function loadWordBank() {
  try {
    const raw = localStorage.getItem(WORD_BANK_KEY);
    return raw ? JSON.parse(raw) : {};
  } catch (e) { return {}; }
}
function saveWordBank(bank) { try { localStorage.setItem(WORD_BANK_KEY, JSON.stringify(bank)); } catch (e) {} }
function addWordsToBank(words, defs, context) {
  const bank = loadWordBank();
  words.forEach(w => {
    if (!bank[w]) {
      bank[w] = { definition: defs[w] || "", context: context || "", correctStreak: 0, dateAdded: todayStr() };
    } else {
      bank[w].definition = defs[w] || bank[w].definition;
      bank[w].context = context || bank[w].context;
    }
  });
  saveWordBank(bank);
}
function dueWordCount() {
  const bank = loadWordBank();
  return Object.keys(bank).filter(w => (bank[w].correctStreak || 0) < 2).length;
}
function todayStr() { const d = new Date(); return d.getFullYear() + "-" + (d.getMonth() + 1) + "-" + d.getDate(); }
function registerSessionStart() {
  const p = loadProgress();
  const today = todayStr();
  if (p.lastPlayed === today) {
    // already played today
  } else {
    const y = new Date(); y.setDate(y.getDate() - 1);
    const yStr = y.getFullYear() + "-" + (y.getMonth() + 1) + "-" + y.getDate();
    if (p.lastPlayed === yStr) p.streak = (p.streak || 0) + 1;
    else p.streak = 1;
    p.lastPlayed = today;
    p.bestStreak = Math.max(p.bestStreak || 0, p.streak);
  }
  p.sessions = (p.sessions || 0) + 1;
  saveProgress(p);
  return p;
}

/* ---------- shuffling ---------- */
function shuffleArray(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}
function currentBank() { return mode === "analogy" ? ANALOGIES : QUESTIONS; }
function availableSessions() {
  const set = new Set(QUESTIONS.map(q => q.session).filter(Boolean));
  const list = Array.from(set);
  list.sort((a, b) => {
    if (a === "bonus") return 1;
    if (b === "bonus") return -1;
    return a.localeCompare(b, undefined, { numeric: true });
  });
  return list;
}
function sessionLabel(key) {
  if (key === "bonus") return "Bonus practice";
  const m = key.match(/^session(\d+)$/);
  if (m) return "Session " + m[1];
  return key;
}
let activeBank = null;
function makeItem(bank, qIdx, isRetry) {
  const q = bank[qIdx];
  const order = shuffleArray([0, 1, 2, 3]);
  const options = order.map(i => q.options[i]);
  const answer = order.indexOf(q.answer);
  return { q, idx: qIdx, isRetry: !!isRetry, options, answer };
}

/* ---------- queue building ---------- */
function buildQueue() {
  let bank = currentBank();
  if (mode === "classification") {
    bank = bank.filter(q => q.session === selectedSession);
  }
  activeBank = bank;
  sessionBankLength = bank.length;
  let indices = bank.map((q, idx) => idx);
  if (easyFirst) {
    const concrete = shuffleArray(indices.filter(i => bank[i].difficulty === "concrete"));
    const abstract = shuffleArray(indices.filter(i => bank[i].difficulty === "abstract"));
    indices = concrete.concat(abstract);
  } else {
    shuffleArray(indices);
  }
  queue = indices.map(i => makeItem(bank, i, false));
  ptr = 0;
  picked = null;
  missReason = null;
  firstTryCorrect = 0;
  retryCorrect = 0;
  neverCorrect = 0;
  missVocab = 0;
  missReasoning = 0;
  sessionVocabWords = [];
  requeuedOnce.clear();
}

function stopTimer() { if (timerInterval) { clearInterval(timerInterval); timerInterval = null; } }
function startTimer() {
  stopTimer();
  if (!timedMode) return;
  timeLeft = TIMER_SECONDS;
  timerInterval = setInterval(() => {
    timeLeft--;
    if (timeLeft <= 0) { stopTimer(); if (picked === null) choose(-1); }
    else { render(); }
  }, 1000);
}

function startQuiz() {
  buildQueue();
  registerSessionStart();
  screen = "quiz";
  render();
  startTimer();
}
function openGuide() { returnScreen = screen; stopTimer(); screen = "guide"; render(); }
function closeGuide() { screen = returnScreen || "quiz"; render(); if (screen === "quiz") startTimer(); }

function setMode(m) { mode = m; render(); }
function setSession(s) { selectedSession = s; render(); }
function toggleEasyFirst() { easyFirst = !easyFirst; render(); }
function toggleTimed() { timedMode = !timedMode; render(); }

function choose(idx) {
  if (picked !== null) return;
  stopTimer();
  const current = queue[ptr];
  picked = idx;
  const isCorrect = idx === current.answer;

  if (isCorrect) {
    if (current.isRetry) retryCorrect++;
    else firstTryCorrect++;
  } else {
    if (!requeuedOnce.has(current.idx)) {
      requeuedOnce.add(current.idx);
      const gap = 3 + Math.floor(Math.random() * 3);
      const insertPos = Math.min(ptr + gap, queue.length);
      queue.splice(insertPos, 0, makeItem(activeBank, current.idx, true));
    } else {
      neverCorrect++;
    }
  }
  render();
}

function setMissReason(reason) {
  missReason = reason;
  if (reason === "vocab") {
    missVocab++;
    const current = queue[ptr];
    const q = current.q;
    const isAnalogy = mode === "analogy";
    const words = isAnalogy ? [q.pair[0], q.pair[1], q.prompt, ...q.options] : q.options;
    addWordsToBank(words, q.defs, q.reason);
    words.forEach(w => { if (!sessionVocabWords.includes(w)) sessionVocabWords.push(w); });
  } else if (reason === "reasoning") {
    missReasoning++;
  }
  render();
}

function next() {
  ptr++;
  picked = null;
  missReason = null;
  if (ptr >= queue.length) screen = "done";
  render();
  if (screen === "quiz") startTimer();
}

function restart() { buildQueue(); screen = "quiz"; render(); startTimer(); }

/* ---------- vocabulary review (flashcards) ---------- */
let reviewQueue = [];
let reviewPtr = 0;
let reviewFlipped = false;
let reviewReviewed = 0;
let reviewMastered = 0;
let reviewTricky = 0;

function startReview() {
  const bank = loadWordBank();
  reviewQueue = shuffleArray(Object.keys(bank).filter(w => (bank[w].correctStreak || 0) < 2));
  reviewPtr = 0;
  reviewFlipped = false;
  reviewReviewed = 0;
  reviewMastered = 0;
  reviewTricky = 0;
  screen = "review";
  render();
}
function flipCard() { reviewFlipped = true; render(); }
function markReview(knowIt) {
  const bank = loadWordBank();
  const word = reviewQueue[reviewPtr];
  if (bank[word]) {
    bank[word].correctStreak = knowIt ? (bank[word].correctStreak || 0) + 1 : 0;
  }
  saveWordBank(bank);
  reviewReviewed++;
  if (knowIt) reviewMastered++; else reviewTricky++;
  reviewPtr++;
  reviewFlipped = false;
  if (reviewPtr >= reviewQueue.length) screen = "reviewDone";
  render();
}
function backToGuide() { screen = "guide"; render(); }

/* ---------- rendering ---------- */
function renderGuide() {
  const p = loadProgress();
  const due = dueWordCount();
  const reviewBannerHtml = due > 0 ? `
    <div class="review-banner">
      <div>
        <div class="review-banner-text">📚 ${due} word${due === 1 ? "" : "s"} to review</div>
        <div class="review-banner-sub">From questions she's missed before</div>
      </div>
      <button class="review-now-btn" onclick="startReview()">Review now</button>
    </div>` : "";

  const streakHtml = (p.sessions > 0) ? `
    <div class="streak-banner">
      <div class="streak-item"><span class="streak-num">🔥 ${p.streak || 0}</span><span class="streak-label">day streak</span></div>
      <div class="streak-item"><span class="streak-num">${p.bestStreak || 0}</span><span class="streak-label">best streak</span></div>
      <div class="streak-item"><span class="streak-num">${p.sessions || 0}</span><span class="streak-label">sessions</span></div>
    </div>` : "";

  const modeSwitchHtml = `
    <div class="mode-switch">
      <button class="mode-btn ${mode === 'classification' ? 'active' : ''}" onclick="setMode('classification')">Odd one out</button>
      <button class="mode-btn ${mode === 'analogy' ? 'active' : ''}" onclick="setMode('analogy')">Analogies</button>
    </div>`;

  let sessionRowHtml = "";
  if (mode === "classification") {
    if (!availableSessions().includes(selectedSession)) selectedSession = availableSessions()[0];
    sessionRowHtml = `
      <div class="session-row">
        <p class="session-label">WHICH SET?</p>
        <div class="session-chips">
          ${availableSessions().map(s => {
            const count = QUESTIONS.filter(q => q.session === s).length;
            return `<button class="session-chip ${selectedSession === s ? 'active' : ''}" onclick="setSession('${s}')">${sessionLabel(s)} <span class="session-count">(${count})</span></button>`;
          }).join("")}
        </div>
      </div>`;
  }

  let title, intro, stepsHtml, exampleHtml;

  if (mode === "analogy") {
    title = "How to solve analogies";
    intro = "These test a different skill: spotting the relationship between a pair of words, then finding a new word that has the same relationship to a third word.";
    stepsHtml = `
      <div class="step"><div class="step-num">1</div><div class="step-body">
        <p class="step-title">Name the relationship in the first pair</p>
        <p class="step-text">"Puppy is to Dog" — how are they connected? Not just "both animals," but specifically: a Puppy grows up <em>into</em> a Dog. That exact connection is what you're matching.</p>
      </div></div>
      <div class="step"><div class="step-num">2</div><div class="step-body">
        <p class="step-title">Apply the same relationship to the third word</p>
        <p class="step-text">If the link is "baby grows into adult," ask: what does a Kitten grow into? Then look for that word in the options.</p>
      </div></div>
      <div class="step"><div class="step-num">3</div><div class="step-body">
        <p class="step-title">Say the sentence out loud with each option</p>
        <p class="step-text">"Puppy is to Dog as Kitten is to ___." Try each option in the blank and see which one makes the sentence make the same kind of sense as the first pair.</p>
      </div></div>
      <div class="step"><div class="step-num">4</div><div class="step-body">
        <p class="step-title">Watch for near-misses</p>
        <p class="step-text">Some wrong options are related to the third word, just not in the <em>same way</em> as the first pair. A word can be a good friend of the topic and still be the wrong answer.</p>
      </div></div>`;
    exampleHtml = `
      <div class="example-box">
        <p class="example-label">WORKED EXAMPLE</p>
        <p class="example-analogy">Puppy is to Dog<br>as<br>Kitten is to <span class="answer-word">Cat</span></p>
      </div>`;
  } else {
    title = "How to find the odd one out";
    intro = "These puzzles are testing one skill: spotting what three words share in common. Here's how to find it on your own, instead of guessing.";
    stepsHtml = `
      <div class="step"><div class="step-num">1</div><div class="step-body">
        <p class="step-title">Name each word's category</p>
        <p class="step-text">Say out loud what each word <em>is</em> — a tree, an animal, a feeling, a tool. Once all four are labeled, the odd one usually stands out on its own.</p>
      </div></div>
      <div class="step"><div class="step-num">2</div><div class="step-body">
        <p class="step-title">Look for the three, not the one</p>
        <p class="step-text">Don't hunt for the word that "looks weird" — the odd one can look perfectly normal. Find what three words share. Whatever's left is the answer, even if it seems ordinary.</p>
      </div></div>`;
    exampleHtml = `
      <div class="example-box">
        <p class="example-label">WORKED EXAMPLE</p>
        <div class="example-row"><span class="example-word">Cedar</span><span class="example-tag">tree</span></div>
        <div class="example-row"><span class="example-word">Birch</span><span class="example-tag">tree</span></div>
        <div class="example-row"><span class="example-word">Maple</span><span class="example-tag">tree</span></div>
        <div class="example-row odd"><span class="example-word">Salmon</span><span class="example-tag">fish — odd one out</span></div>
      </div>`;
    stepsHtml += `
      <div class="step"><div class="step-num">3</div><div class="step-body">
        <p class="step-title">Go word by word if you're stuck</p>
        <p class="step-text">Slower, but it always works: label option A, then B, then C, then D. Somewhere along the way, one word won't match the others' category.</p>
      </div></div>
      <div class="step"><div class="step-num">4</div><div class="step-body">
        <p class="step-title">Ask what kind of connection it is</p>
        <p class="step-text">Sometimes the link isn't a topic — it's a relationship. Naming the type of connection, not just the topic, catches trickier questions.</p>
      </div></div>`;
  }

  app.innerHTML = `
    <div class="card guide-card">
      ${reviewBannerHtml}
      ${streakHtml}
      ${modeSwitchHtml}
      ${sessionRowHtml}
      <p class="guide-eyebrow">Before you start</p>
      <h1 class="guide-title">${title}</h1>
      <p class="guide-intro">${intro}</p>
      ${stepsHtml}
      ${exampleHtml}

      <div class="settings-box">
        <div class="setting-row">
          <div class="setting-text">
            <p class="setting-title">Easy words first</p>
            <p class="setting-sub">Concrete categories before abstract ones (synonyms, grammar, science concepts...)</p>
          </div>
          <label class="switch"><input type="checkbox" ${easyFirst ? "checked" : ""} onchange="toggleEasyFirst()"><span class="switch-track"></span></label>
        </div>
        <div class="setting-row">
          <div class="setting-text">
            <p class="setting-title">Timed mode</p>
            <p class="setting-sub">${TIMER_SECONDS} seconds per question. Turn on once she's accurate untimed.</p>
          </div>
          <label class="switch"><input type="checkbox" ${timedMode ? "checked" : ""} onchange="toggleTimed()"><span class="switch-track"></span></label>
        </div>
      </div>

      <button class="start-btn" onclick="startQuiz()">${queue ? "Back to quiz" : "Start the quiz"}</button>
      <p class="skip-note">Tap the <strong>?</strong> anytime during the quiz to see this again.</p>
    </div>`;
}

function renderQuiz() {
  const current = queue[ptr];
  const q = current.q;
  const pct = (ptr / queue.length) * 100;
  const scoreSoFar = firstTryCorrect + retryCorrect;
  const isAnalogy = mode === "analogy";

  let optsHtml = current.options.map((opt, idx) => {
    let cls = "opt-btn";
    if (picked !== null) {
      if (idx === current.answer) cls += " correct";
      else if (idx === picked) cls += " wrong";
    }
    return `<button class="${cls}" ${picked !== null ? "disabled" : ""} onclick="choose(${idx})">
      <span class="opt-letter">${letters[idx]}</span><span>${opt}</span>
    </button>`;
  }).join("");

  let promptHtml;
  if (isAnalogy) {
    promptHtml = `<p class="analogy-prompt">${q.pair[0]} is to ${q.pair[1]}<br>as<br>${q.prompt} is to <span class="analogy-blank">___</span></p>`;
  } else {
    promptHtml = `<p class="prompt">Three of these four words belong together. Which one doesn't belong?</p>`;
  }

  let feedbackHtml = "";
  if (picked !== null) {
    const isCorrect = picked === current.answer;
    const willReturn = !isCorrect && requeuedOnce.has(current.idx) && !current.isRetry;
    const allWords = isAnalogy ? [q.pair[0], q.pair[1], q.prompt, ...q.options] : current.options;
    const seen = new Set();
    const defsHtml = allWords.filter(w => { if (seen.has(w)) return false; seen.add(w); return true; }).map(w =>
      `<p class="def-row"><span class="def-word">${w}</span> <span class="def-text">— ${q.defs[w]}</span></p>`
    ).join("");

    let missReasonHtml = "";
    if (!isCorrect) {
      missReasonHtml = `
        <div class="miss-reason">
          <p class="miss-reason-label">WHAT HAPPENED THERE?</p>
          <div class="miss-reason-btns">
            <button class="miss-btn ${missReason === 'vocab' ? 'selected' : ''}" onclick="setMissReason('vocab')">Didn't know the words</button>
            <button class="miss-btn ${missReason === 'reasoning' ? 'selected' : ''}" onclick="setMissReason('reasoning')">Knew them, picked wrong</button>
          </div>
        </div>`;
    }

    feedbackHtml = `
      <div class="feedback show">
        <p class="verdict ${isCorrect ? "correct" : "wrong"}">${isCorrect ? "Correct" : (picked === -1 ? `Time's up — the answer is ${current.options[current.answer]}` : `Not quite — the answer is ${current.options[current.answer]}`)}</p>
        <p class="reason">${q.reason}</p>
        ${willReturn ? `<p class="requeue-note">This one will come back around in a few questions so you can try it again.</p>` : ""}
        ${missReasonHtml}
        <p class="defs-label">WORD MEANINGS</p>
        ${defsHtml}
        <button class="next-btn" onclick="next()">${ptr + 1 < queue.length ? "Next question" : "See my score"}</button>
      </div>`;
  }

  const timerHtml = (timedMode && picked === null) ? `<span class="timer-label ${timeLeft <= 5 ? 'low' : ''}">⏱ ${timeLeft}s</span>` : "";

  app.innerHTML = `
    <div class="topbar">
      <div class="topbar-left">
        <button class="help-btn" onclick="openGuide()" title="How to solve these">?</button>
        <span class="progress-label">Question ${ptr + 1} of ${queue.length}</span>
      </div>
      <div class="topbar-right">${timerHtml}<span class="score-label">Score: ${scoreSoFar}</span></div>
    </div>
    <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
    <div class="card">
      <div class="tag-row">
        ${current.isRetry ? `<span class="tag review">Second try</span>` : ""}
        ${q.difficulty === "abstract" ? `<span class="tag abstract">Abstract</span>` : ""}
      </div>
      ${promptHtml}
      <div class="options">${optsHtml}</div>
      ${feedbackHtml}
    </div>`;
}

function renderDone() {
  stopTimer();
  const total = sessionBankLength;
  const mastered = firstTryCorrect + retryCorrect;
  const pct = mastered / total;
  const msg = neverCorrect === 0 && pct === 1
    ? "Every single one, mastered — first try or after a second look."
    : pct >= 0.85 ? "Strong finish. That's a sharp eye for how these words connect."
    : "Good practice round. Play again and watch the score climb.";

  const vocabWordsHtml = sessionVocabWords.length > 0 ? `
    <p class="defs-label" style="text-align:left; margin-top: 4px;">WORDS TO REVIEW</p>
    <div class="vocab-words">${sessionVocabWords.map(w => `<span class="vocab-word-chip">${w}</span>`).join("")}</div>
    <button class="start-btn" style="margin-bottom: 12px;" onclick="startReview()">Review these now</button>
  ` : "";

  app.innerHTML = `
    <div class="card result-card">
      <p class="result-eyebrow">All done</p>
      <h1 class="result-score">${mastered} of ${total} mastered</h1>
      <p class="result-breakdown">${firstTryCorrect} first try &nbsp;·&nbsp; ${retryCorrect} on a second try &nbsp;·&nbsp; ${neverCorrect} to review again</p>
      <p class="result-breakdown2">${missVocab + missReasoning > 0 ? `Missed for vocab: ${missVocab} &nbsp;·&nbsp; missed for reasoning: ${missReasoning}` : ""}</p>
      <p class="result-msg">${msg}</p>
      ${vocabWordsHtml}
      <button class="replay-btn" onclick="restart()">Play again</button>
    </div>`;
}

function renderReview() {
  const word = reviewQueue[reviewPtr];
  const bank = loadWordBank();
  const entry = bank[word] || { definition: "", context: "" };
  const pct = (reviewPtr / reviewQueue.length) * 100;

  const meaningHtml = reviewFlipped ? `
      <div class="review-meaning">
        <p class="review-def"><strong>${word}</strong> — ${entry.definition}</p>
        <p class="review-context">${entry.context}</p>
      </div>
      <div class="review-btns">
        <button class="review-btn tricky" onclick="markReview(false)">Still tricky</button>
        <button class="review-btn know" onclick="markReview(true)">I know it now</button>
      </div>` : `
      <button class="flip-btn" onclick="flipCard()">Show meaning</button>`;

  app.innerHTML = `
    <div class="topbar">
      <div class="topbar-left"><span class="progress-label">Word ${reviewPtr + 1} of ${reviewQueue.length}</span></div>
    </div>
    <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
    <div class="card review-flash">
      <p class="prompt" style="text-align:center;">What does this word mean?</p>
      <p class="review-word">${word}</p>
      ${meaningHtml}
    </div>`;
}

function renderReviewDone() {
  app.innerHTML = `
    <div class="card result-card">
      <p class="result-eyebrow">Review complete</p>
      <h1 class="result-score">${reviewReviewed} word${reviewReviewed === 1 ? "" : "s"} reviewed</h1>
      <p class="review-summary-stat">${reviewMastered} she knew &nbsp;·&nbsp; ${reviewTricky} still tricky — they'll come back next time</p>
      <button class="replay-btn" onclick="backToGuide()">Back to start</button>
    </div>`;
}

function render() {
  if (screen === "guide") renderGuide();
  else if (screen === "quiz") renderQuiz();
  else if (screen === "review") renderReview();
  else if (screen === "reviewDone") renderReviewDone();
  else renderDone();
}

render();
</script>
</body>
</html>
