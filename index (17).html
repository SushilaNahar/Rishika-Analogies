  .switch-track::before {

  .review-word { font-size: 30px; font-weight: 700; margin: 20px 0 24px; }

  .review-btn.tricky { background: rgba(180,72,58,0.1); color: var(--red); }
  .review-btn.know { background: var(--green); color: var(--paper); }
  .review-summary-stat { font-size: 13px; opacity: 0.65; margin: 0 0 18px; }

  .session-row { margin: 0 0 20px; }
  .session-label { font-size: 12px; font-weight: 600; opacity: 0.55; margin: 0 0 8px; }

    padding: 9px 14px; border-radius: 10px; border: 1.5px solid rgba(43,36,25,0.2);

    font-family: inherit; cursor: pointer;
  }
  .session-chip.active { background: var(--navy); color: var(--paper); border-color: var(--navy); }
  .session-count { opacity: 0.6; font-weight: 400; }
</style>
</head>

const STORAGE_KEY = "wordPuzzlesProgress";
const TIMER_SECONDS = 20;

let mode = "classification"; // "classification" | "analogy"
let selectedSession = "session1"; // which bank of classification questions to practice
let screen = "guide";
let queue = null;
let ptr = 0;
let picked = null;
let missReason = null;
let returnScreen = null;
let sessionBankLength = 0;

let firstTryCorrect = 0;
let retryCorrect = 0;
let neverCorrect = 0;
let missVocab = 0;
let missReasoning = 0;
let sessionVocabWords = [];
const requeuedOnce = new Set();

let easyFirst = true;
let timedMode = false;
let timeLeft = TIMER_SECONDS;
let timerInterval = null;

const app = document.getElementById("app");
const letters = ["A", "B", "C", "D", "E"];

/* ---------- persistence ---------- */
function loadProgress() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return { streak: 0, bestStreak: 0, lastPlayed: null, sessions: 0 };
    return JSON.parse(raw);
  } catch (e) { return { streak: 0, bestStreak: 0, lastPlayed: null, sessions: 0 }; }
}
function saveProgress(p) { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(p)); } catch (e) {} }

/* ---------- word bank (vocab review) ---------- */
const WORD_BANK_KEY = "wordPuzzlesWordBank";
function loadWordBank() {
  try {
    const raw = localStorage.getItem(WORD_BANK_KEY);
    return raw ? JSON.parse(raw) : {};
  } catch (e) { return {}; }
}
function saveWordBank(bank) { try { localStorage.setItem(WORD_BANK_KEY, JSON.stringify(bank)); } catch (e) {} }
function addWordsToBank(words, defs, context) {
  const bank = loadWordBank();
  words.forEach(w => {
    if (!bank[w]) {
      bank[w] = { definition: defs[w] || "", context: context || "", correctStreak: 0, dateAdded: todayStr() };
    } else {
      bank[w].definition = defs[w] || bank[w].definition;
      bank[w].context = context || bank[w].context;
    }
  });
  saveWordBank(bank);
}
function dueWordCount() {
  const bank = loadWordBank();
  return Object.keys(bank).filter(w => (bank[w].correctStreak || 0) < 2).length;
}
function todayStr() { const d = new Date(); return d.getFullYear() + "-" + (d.getMonth() + 1) + "-" + d.getDate(); }
function registerSessionStart() {
  const p = loadProgress();
  const today = todayStr();
  if (p.lastPlayed === today) {
    // already played today
  } else {
    const y = new Date(); y.setDate(y.getDate() - 1);
    const yStr = y.getFullYear() + "-" + (y.getMonth() + 1) + "-" + y.getDate();
    if (p.lastPlayed === yStr) p.streak = (p.streak || 0) + 1;
    else p.streak = 1;
    p.lastPlayed = today;
    p.bestStreak = Math.max(p.bestStreak || 0, p.streak);
  }
  p.sessions = (p.sessions || 0) + 1;
  saveProgress(p);
  return p;
}

/* ---------- shuffling ---------- */
function shuffleArray(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}
function currentBank() {
  if (mode === "analogy") return ANALOGIES;
  if (mode === "grouping") return GROUPING;
  return QUESTIONS;
}
function availableSessions() {
  const bank = currentBank();
  const set = new Set(bank.map(q => q.session).filter(Boolean));
  const list = Array.from(set);
  list.sort((a, b) => {
    if (a === "bonus") return 1;
    if (b === "bonus") return -1;
    return a.localeCompare(b, undefined, { numeric: true });
  });
  return list;
}
function sessionLabel(key) {
  if (key === "bonus") return "Bonus practice";
  const m = key.match(/^session(\d+)$/);
  if (m) return "Session " + m[1];
  return key;
}
let activeBank = null;
function makeItem(bank, qIdx, isRetry) {
  const q = bank[qIdx];
  const n = q.options.length;
  const order = shuffleArray(Array.from({ length: n }, (_, i) => i));
  const options = order.map(i => q.options[i]);
  const answer = order.indexOf(q.answer);
  return { q, idx: qIdx, isRetry: !!isRetry, options, answer };
}

/* ---------- queue building ---------- */
function buildQueue() {
  let bank = currentBank();
  if (mode === "classification" || mode === "grouping" || mode === "analogy") {
    bank = bank.filter(q => q.session === selectedSession);
  }
  activeBank = bank;
  sessionBankLength = bank.length;
  let indices = bank.map((q, idx) => idx);
  if (easyFirst) {
    const concrete = shuffleArray(indices.filter(i => bank[i].difficulty === "concrete"));
    const abstract = shuffleArray(indices.filter(i => bank[i].difficulty === "abstract"));
    indices = concrete.concat(abstract);
  } else {
    shuffleArray(indices);
  }
  queue = indices.map(i => makeItem(bank, i, false));
  ptr = 0;
  picked = null;
  missReason = null;
  firstTryCorrect = 0;
  retryCorrect = 0;
  neverCorrect = 0;
  missVocab = 0;
  missReasoning = 0;
  sessionVocabWords = [];
  requeuedOnce.clear();
}

function stopTimer() { if (timerInterval) { clearInterval(timerInterval); timerInterval = null; } }
function startTimer() {
  stopTimer();
  if (!timedMode) return;
  timeLeft = TIMER_SECONDS;
  timerInterval = setInterval(() => {
    timeLeft--;
    if (timeLeft <= 0) { stopTimer(); if (picked === null) choose(-1); }
    else { render(); }
  }, 1000);
}

function startQuiz() {
  buildQueue();
  registerSessionStart();
  screen = "quiz";
  render();
  startTimer();
}
function openGuide() { returnScreen = screen; stopTimer(); screen = "guide"; render(); }
function closeGuide() { screen = returnScreen || "quiz"; render(); if (screen === "quiz") startTimer(); }

function setMode(m) { mode = m; render(); }
function setSession(s) { selectedSession = s; render(); }
function toggleEasyFirst() { easyFirst = !easyFirst; render(); }
function toggleTimed() { timedMode = !timedMode; render(); }

function choose(idx) {
  if (picked !== null) return;
  stopTimer();
  const current = queue[ptr];
  picked = idx;
  const isCorrect = idx === current.answer;

  if (isCorrect) {
    if (current.isRetry) retryCorrect++;
    else firstTryCorrect++;
  } else {
    if (!requeuedOnce.has(current.idx)) {
      requeuedOnce.add(current.idx);
      const gap = 3 + Math.floor(Math.random() * 3);
      const insertPos = Math.min(ptr + gap, queue.length);
      queue.splice(insertPos, 0, makeItem(activeBank, current.idx, true));
    } else {
      neverCorrect++;
    }
  }
  render();
}

function setMissReason(reason) {
  missReason = reason;
  if (reason === "vocab") {
    missVocab++;
    const current = queue[ptr];
    const q = current.q;
    const isAnalogy = mode === "analogy";
    const isGrouping = mode === "grouping";
    const words = isAnalogy ? [q.pair[0], q.pair[1], q.prompt, ...q.options]
      : isGrouping ? [...q.group, ...q.options]
      : q.options;
    addWordsToBank(words, q.defs, q.reason);
    words.forEach(w => { if (!sessionVocabWords.includes(w)) sessionVocabWords.push(w); });
  } else if (reason === "reasoning") {
    missReasoning++;
  }
  render();
}

function next() {
  ptr++;
  picked = null;
  missReason = null;
  if (ptr >= queue.length) screen = "done";
  render();
  if (screen === "quiz") startTimer();
}

function restart() { buildQueue(); screen = "quiz"; render(); startTimer(); }

/* ---------- vocabulary review (flashcards) ---------- */
let reviewQueue = [];
let reviewPtr = 0;
let reviewFlipped = false;
let reviewReviewed = 0;
let reviewMastered = 0;
let reviewTricky = 0;

function startReview() {
  const bank = loadWordBank();
  reviewQueue = shuffleArray(Object.keys(bank).filter(w => (bank[w].correctStreak || 0) < 2));
  reviewPtr = 0;
  reviewFlipped = false;
  reviewReviewed = 0;
  reviewMastered = 0;
  reviewTricky = 0;
  screen = "review";
  render();
}
function flipCard() { reviewFlipped = true; render(); }
function markReview(knowIt) {
  const bank = loadWordBank();
  const word = reviewQueue[reviewPtr];
  if (bank[word]) {
    bank[word].correctStreak = knowIt ? (bank[word].correctStreak || 0) + 1 : 0;
  }
  saveWordBank(bank);
  reviewReviewed++;
  if (knowIt) reviewMastered++; else reviewTricky++;
  reviewPtr++;
  reviewFlipped = false;
  if (reviewPtr >= reviewQueue.length) screen = "reviewDone";
  render();
}
function backToGuide() { screen = "guide"; render(); }

function renderQuiz() {
  const current = queue[ptr];

  let optsHtml = current.options.map((opt, idx) => {

      <span class="opt-letter">${letters[idx]}</span><span>${opt}</span>
    </button>`;

  let promptHtml;
  if (isAnalogy) {

    promptHtml = `<p class="analogy-prompt">${q.group.join(" — ")}<br><span style="font-size:14px; font-weight:400; opacity:0.65;">Which of these also belongs in this group?</span></p>`;
  } else {
    promptHtml = `<p class="prompt">Three of these four words belong together. Which one doesn't belong?</p>`;
  }

  let feedbackHtml = "";
  if (picked !== null) {
    const isCorrect = picked === current.answer;
    const willReturn = !isCorrect && requeuedOnce.has(current.idx) && !current.isRetry;
    const allWords = isAnalogy ? [q.pair[0], q.pair[1], q.prompt, ...q.options]
      : isGrouping ? [...q.group, ...current.options]
      : current.options;
    const seen = new Set();
    const defsHtml = allWords.filter(w => { if (seen.has(w)) return false; seen.add(w); return true; }).map(w =>
      `<p class="def-row"><span class="def-word">${w}</span> <span class="def-text">— ${q.defs[w]}</span></p>`
    ).join("");

    let missReasonHtml = "";
    if (!isCorrect) {
      missReasonHtml = `
        <div class="miss-reason">
          <p class="miss-reason-label">WHAT HAPPENED THERE?</p>
          <div class="miss-reason-btns">
            <button class="miss-btn ${missReason === 'vocab' ? 'selected' : ''}" onclick="setMissReason('vocab')">Didn't know the words</button>
            <button class="miss-btn ${missReason === 'reasoning' ? 'selected' : ''}" onclick="setMissReason('reasoning')">Knew them, picked wrong</button>
          </div>
        </div>`;
    }

    feedbackHtml = `
      <div class="feedback show">
        <p class="verdict ${isCorrect ? "correct" : "wrong"}">${isCorrect ? "Correct" : (picked === -1 ? `Time's up — the answer is ${current.options[current.answer]}` : `Not quite — the answer is ${current.options[current.answer]}`)}</p>
        <p class="reason">${q.reason}</p>
        ${willReturn ? `<p class="requeue-note">This one will come back around in a few questions so you can try it again.</p>` : ""}
        ${missReasonHtml}
        <p class="defs-label">WORD MEANINGS</p>
        ${defsHtml}
        <button class="next-btn" onclick="next()">${ptr + 1 < queue.length ? "Next question" : "See my score"}</button>
      </div>`;
  }

  const timerHtml = (timedMode && picked === null) ? `<span class="timer-label ${timeLeft <= 5 ? 'low' : ''}">⏱ ${timeLeft}s</span>` : "";

  app.innerHTML = `
    <div class="topbar">
      <div class="topbar-left">
        <button class="help-btn" onclick="openGuide()" title="How to solve these">?</button>
        <span class="progress-label">Question ${ptr + 1} of ${queue.length}</span>
      </div>
      <div class="topbar-right">${timerHtml}<span class="score-label">Score: ${scoreSoFar}</span></div>
    </div>
    <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
    <div class="card">
      <div class="tag-row">
        ${current.isRetry ? `<span class="tag review">Second try</span>` : ""}
        ${q.difficulty === "abstract" ? `<span class="tag abstract">Abstract</span>` : ""}
      </div>
      ${promptHtml}
      <div class="options">${optsHtml}</div>
      ${feedbackHtml}
    </div>`;
}

function renderDone() {
  stopTimer();
  const total = sessionBankLength;
  const mastered = firstTryCorrect + retryCorrect;
  const pct = mastered / total;
  const msg = neverCorrect === 0 && pct === 1
    ? "Every single one, mastered — first try or after a second look."
    : pct >= 0.85 ? "Strong finish. That's a sharp eye for how these words connect."
    : "Good practice round. Play again and watch the score climb.";

  const vocabWordsHtml = sessionVocabWords.length > 0 ? `
    <p class="defs-label" style="text-align:left; margin-top: 4px;">WORDS TO REVIEW</p>
    <div class="vocab-words">${sessionVocabWords.map(w => `<span class="vocab-word-chip">${w}</span>`).join("")}</div>
    <button class="start-btn" style="margin-bottom: 12px;" onclick="startReview()">Review these now</button>
  ` : "";

  app.innerHTML = `
    <div class="card result-card">
      <p class="result-eyebrow">All done</p>
      <h1 class="result-score">${mastered} of ${total} mastered</h1>
      <p class="result-breakdown">${firstTryCorrect} first try &nbsp;·&nbsp; ${retryCorrect} on a second try &nbsp;·&nbsp; ${neverCorrect} to review again</p>
      <p class="result-breakdown2">${missVocab + missReasoning > 0 ? `Missed for vocab: ${missVocab} &nbsp;·&nbsp; missed for reasoning: ${missReasoning}` : ""}</p>
      <p class="result-msg">${msg}</p>
      ${vocabWordsHtml}
      <button class="replay-btn" onclick="restart()">Play again</button>
    </div>`;
}

function renderReview() {
  const word = reviewQueue[reviewPtr];
  const bank = loadWordBank();
  const entry = bank[word] || { definition: "", context: "" };
  const pct = (reviewPtr / reviewQueue.length) * 100;

  const meaningHtml = reviewFlipped ? `
      <div class="review-meaning">
        <p class="review-def"><strong>${word}</strong> — ${entry.definition}</p>
        <p class="review-context">${entry.context}</p>
      </div>
      <div class="review-btns">
        <button class="review-btn tricky" onclick="markReview(false)">Still tricky</button>
        <button class="review-btn know" onclick="markReview(true)">I know it now</button>
      </div>` : `
      <button class="flip-btn" onclick="flipCard()">Show meaning</button>`;

  app.innerHTML = `
    <div class="topbar">
      <div class="topbar-left"><span class="progress-label">Word ${reviewPtr + 1} of ${reviewQueue.length}</span></div>
    </div>
    <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
    <div class="card review-flash">
      <p class="prompt" style="text-align:center;">What does this word mean?</p>
      <p class="review-word">${word}</p>
      ${meaningHtml}
    </div>`;
}

function renderReviewDone() {
  app.innerHTML = `
    <div class="card result-card">
      <p class="result-eyebrow">Review complete</p>
      <h1 class="result-score">${reviewReviewed} word${reviewReviewed === 1 ? "" : "s"} reviewed</h1>
      <p class="review-summary-stat">${reviewMastered} she knew &nbsp;·&nbsp; ${reviewTricky} still tricky — they'll come back next time</p>
      <button class="replay-btn" onclick="backToGuide()">Back to start</button>
    </div>`;
}

function render() {
  if (screen === "guide") renderGuide();
  else if (screen === "quiz") renderQuiz();
  else if (screen === "review") renderReview();
  else if (screen === "reviewDone") renderReviewDone();
  else renderDone();
}

render();
</script>
</body>
</html>
